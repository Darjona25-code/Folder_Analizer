[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-analyzer"
version = "3.0.0"
description = "A disk space analyzer that scans drives, reports folder sizes, and safely frees disk space"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Darjona25-code"},
]
dependencies = [
    "rich>=13.0.0",
    "send2trash>=1.8.2",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
desktop = [
    "PySide6>=6.6",
]

[project.scripts]
folder-analyzer = "folder_analyzer.__main__:main"
folder-analyzer-desktop = "desktop_app.__main__:main"

[tool.setuptools.packages.find]
include = ["folder_analyzer*", "desktop_app*"]

[tool.setuptools.package-data]
folder_analyzer = ["locales/*.json"]
